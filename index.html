<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Surprise - Ela</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-1: #ffdde1;
      --bg-pink-2: #ee9ca7;
      --accent-pink: #ff2a6d;
      --accent-soft: #ff758f;
      --text-main: #4a152b;
      --text-sub: #8a4b66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-pink-1) 0%, var(--bg-pink-2) 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 15px;
    }

    /* Floating Balloons, Hearts & Birthday Vibe OVER everything */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 25;
    }

    .bg-hearts span {
      position: absolute;
      bottom: -60px;
      font-size: 22px;
      opacity: 0.75;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 4px 6px rgba(255, 42, 109, 0.2));
    }

    .bg-hearts span:nth-child(1)  { left: 4%;  animation-duration: 6.5s; animation-delay: 0s;   font-size: 26px; }
    .bg-hearts span:nth-child(2)  { left: 14%; animation-duration: 8.5s; animation-delay: 1.5s; font-size: 24px; }
    .bg-hearts span:nth-child(3)  { left: 22%; animation-duration: 7s;   animation-delay: 0.5s; font-size: 28px; }
    .bg-hearts span:nth-child(4)  { left: 32%; animation-duration: 9s;   animation-delay: 2.5s; font-size: 22px; }
    .bg-hearts span:nth-child(5)  { left: 42%; animation-duration: 6s;   animation-delay: 1s;   font-size: 25px; }
    .bg-hearts span:nth-child(6)  { left: 53%; animation-duration: 7.5s; animation-delay: 3s;   font-size: 30px; }
    .bg-hearts span:nth-child(7)  { left: 64%; animation-duration: 8s;   animation-delay: 0.8s; font-size: 22px; }
    .bg-hearts span:nth-child(8)  { left: 74%; animation-duration: 6.8s; animation-delay: 2s;   font-size: 26px; }
    .bg-hearts span:nth-child(9)  { left: 84%; animation-duration: 9.5s; animation-delay: 3.5s; font-size: 24px; }
    .bg-hearts span:nth-child(10) { left: 93%; animation-duration: 7.2s; animation-delay: 1.2s; font-size: 28px; }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.8; }
      50% { transform: translateY(-55vh) translateX(18px) rotate(15deg); opacity: 0.75; }
      100% { transform: translateY(-115vh) translateX(-18px) rotate(360deg); opacity: 0; }
    }

    /* Main Split Container */
    .surprise-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 25px 50px rgba(173, 20, 87, 0.18);
      display: flex;
      flex-direction: row;
      max-width: 900px;
      width: 100%;
      min-height: 520px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Left Section: Overlapping Rounded-Star Sticker Photos */
    .left-section {
      flex: 1.1;
      background: linear-gradient(160deg, rgba(255, 240, 245, 0.88) 0%, rgba(255, 182, 193, 0.45) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 25px;
      border-right: 1.5px solid rgba(255, 255, 255, 0.7);
    }

    .top-badge {
      background: linear-gradient(135deg, #fff0f5, #ffffff);
      color: var(--accent-pink);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid #ffd1dc;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.14);
      margin-bottom: 18px;
      z-index: 5;
    }

    .star-collage {
      position: relative;
      width: 270px;
      height: 235px;
      margin-bottom: 14px;
      z-index: 4;
    }

    .star-sticker {
      position: absolute;
      width: 155px;
      height: 155px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .star-sticker.top-star {
      top: 0;
      left: 16px;
      transform: rotate(-10deg);
      z-index: 3;
    }

    .star-sticker.bottom-star {
      bottom: 0;
      right: 14px;
      transform: rotate(12deg);
      z-index: 2;
    }

    .star-sticker:hover {
      transform: scale(1.08) rotate(0deg);
      z-index: 10;
    }

    .star-sticker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: url(#roundedStarClip);
      display: block;
    }

    .star-border-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Outer soft pink sticker outline */
    .star-border-svg .outer-pink {
      fill: none;
      stroke: #f7c6d7;
      stroke-width: 9.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 6px 10px rgba(181, 44, 91, 0.18));
    }

    /* Inner crisp white sticker outline */
    .star-border-svg .inner-white {
      fill: none;
      stroke: #ffffff;
      stroke-width: 5.5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .romantic-quote {
      text-align: center;
      z-index: 3;
      max-width: 310px;
    }

    .romantic-quote h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 36px;
      color: var(--accent-pink);
      line-height: 1.1;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(255, 42, 109, 0.15);
    }

    .romantic-quote p {
      font-size: 12px;
      color: var(--text-sub);
      font-style: italic;
    }

    .city-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(to top, rgba(216, 27, 96, 0.25), transparent);
      clip-path: polygon(
        0% 100%, 0% 60%, 8% 60%, 8% 40%, 15% 40%, 15% 70%, 22% 70%, 22% 25%, 
        30% 25%, 30% 50%, 38% 50%, 38% 15%, 45% 15%, 45% 55%, 55% 55%, 
        55% 30%, 65% 30%, 65% 65%, 75% 65%, 75% 20%, 85% 20%, 85% 50%, 
        93% 50%, 93% 70%, 100% 70%, 100% 100%
      );
      pointer-events: none;
    }

    /* Right Section */
    .right-section {
      flex: 0.9;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .right-section h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .right-section .sub-prompt {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .pass-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(255, 240, 245, 0.95);
      padding: 7px 18px;
      border-radius: 25px;
      border: 1.5px solid #ffc2d1;
      box-shadow: inset 0 2px 5px rgba(255, 42, 109, 0.08);
      transition: transform 0.2s ease;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-soft);
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: transparent;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dot.filled {
      background: linear-gradient(135deg, #ff2a6d, #ff758f);
      border-color: #ff2a6d;
      color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 3px 8px rgba(255, 42, 109, 0.35);
    }

    /* Compact Aesthetic Heart-Shaped Keypad Wrapper */
    .keypad-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 235px;
      justify-content: center;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 230px;
      margin-bottom: 10px;
      transition: opacity 0.3s ease;
    }

    .keypad-grid.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .key-btn {
      height: 60px;
      width: 65px;
      justify-self: center;
      align-self: center;
      background: linear-gradient(145deg, #fffafd 0%, #ffdce8 55%, #ffb6cd 100%);
      border: none;
      clip-path: path("M 32.5 56 C 26 50, 2 36, 2 19 C 2 4, 23 0, 32.5 13 C 42 0, 63 4, 63 19 C 63 36, 39 50, 32.5 56 Z");
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease;
      filter: drop-shadow(0 4px 5px rgba(255, 42, 109, 0.2));
      padding-top: 5px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .key-btn:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 6px 8px rgba(255, 42, 109, 0.32));
    }

    /* Aesthetic Luxury Glowing Press Effect */
    @keyframes aestheticPressGlow {
      0%   { 
        transform: scale(1); 
        background: linear-gradient(145deg, #fffafd, #ffb6cd);
        filter: drop-shadow(0 4px 5px rgba(255, 42, 109, 0.2)); 
      }
      35%  { 
        transform: scale(0.88); 
        background: linear-gradient(145deg, #ff85a2, #ff1a5d);
        filter: drop-shadow(0 0 16px #ff2a6d) brightness(1.35); 
      }
      70%  { 
        transform: scale(1.15) translateY(-3px); 
        background: linear-gradient(145deg, #ffb3ca, #ff4d80);
        filter: drop-shadow(0 0 12px #ff758f) brightness(1.2); 
      }
      100% { 
        transform: scale(1); 
        background: linear-gradient(145deg, #fffafd 0%, #ffdce8 55%, #ffb6cd 100%);
        filter: drop-shadow(0 4px 5px rgba(255, 42, 109, 0.2)); 
      }
    }

    .key-btn.glow-anim {
      animation: aestheticPressGlow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Full-Pad Peach Cat Overlay for Wrong Password */
    .cute-cat-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 240, 245, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 40;
      border: 1.5px solid #ffb6cd;
      box-shadow: 0 8px 25px rgba(255, 42, 109, 0.2);
    }

    .cute-cat-overlay.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .cat-gif-large {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.3);
    }

    .cat-msg {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      color: #b52c5b;
      margin-top: 2px;
    }

    /* Soaring Heart & Flying Arrow Animation Elements */
    .soaring-heart {
      position: fixed;
      pointer-events: none;
      z-index: 99998;
      font-size: 28px;
      user-select: none;
      filter: drop-shadow(0 0 10px rgba(255, 42, 109, 0.8));
      transform: translate(-50%, -50%);
      transition: top 0.65s cubic-bezier(0.25, 1, 0.5, 1), left 0.65s ease-out, transform 0.3s ease;
    }

    .flying-arrow {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      font-size: 26px;
      user-select: none;
      filter: drop-shadow(0 3px 6px rgba(255, 42, 109, 0.6));
      transform: translate(-50%, -50%) rotate(-40deg);
      transition: top 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.15s ease;
    }

    .shatter-piece {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 42, 109, 0.85));
      animation: shatterFly 0.75s cubic-bezier(0.15, 1, 0.3, 1) forwards;
    }

    @keyframes shatterFly {
      0% {
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--drot));
        opacity: 0;
      }
    }

    .key-num {
      font-size: 14px;
      font-weight: 600;
      color: #9e3158;
      line-height: 1.1;
    }

    .key-sub {
      font-size: 7.5px;
      color: #e7477c;
      font-weight: 500;
    }

    .key-btn.action-heart {
      background: linear-gradient(145deg, #ffb3ca, #ff2a6d);
    }

    .key-btn.action-heart .key-num,
    .key-btn.action-heart .key-sub {
      color: white;
    }

    .key-btn.action-back {
      background: linear-gradient(145deg, #ff2a6d, #ff85a5);
    }

    .key-btn.action-back .key-num,
    .key-btn.action-back .key-sub {
      color: white;
    }

    .error-msg {
      color: #d90429;
      font-size: 11.5px;
      font-weight: 500;
      margin-top: 6px;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .error-msg.show {
      opacity: 1;
    }

    .hint-box {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 6px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 15px;
      transition: 0.2s;
    }

    .hint-box:hover {
      background: rgba(255, 255, 255, 0.7);
      color: var(--accent-pink);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      .surprise-card {
        flex-direction: column;
        max-width: 370px;
        min-height: auto;
      }
      .left-section {
        padding: 22px 15px 18px;
        border-right: none;
        border-bottom: 1.5px solid rgba(255, 255, 255, 0.7);
      }
      .top-badge {
        margin-bottom: 12px;
      }
      .star-collage {
        width: 235px;
        height: 205px;
        margin-bottom: 10px;
      }
      .star-sticker {
        width: 132px;
        height: 132px;
      }
      .romantic-quote h2 {
        font-size: 28px;
      }
      .right-section {
        padding: 20px 15px;
      }
      .right-section h1 {
        font-size: 36px;
      }
      .key-btn {
        height: 54px;
        width: 58px;
      }
      .key-num {
        font-size: 13px;
      }
      .key-sub {
        font-size: 7px;
      }
    }
  </style>
</head>
<body>

  <!-- Rounded 5-Point Star ClipPath + Sticker Outline Path -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <clipPath id="roundedStarClip" clipPathUnits="objectBoundingBox">
        <path d="M 0.50 0.05 C 0.54 0.05 0.57 0.07 0.59 0.11 L 0.69 0.31 L 0.91 0.34 C 0.95 0.35 0.98 0.38 0.99 0.42 C 1.00 0.46 0.98 0.50 0.95 0.53 L 0.79 0.69 L 0.83 0.91 C 0.84 0.95 0.82 0.99 0.78 1.00 C 0.74 1.01 0.70 1.00 0.67 0.98 L 0.50 0.87 L 0.33 0.98 C 0.30 1.00 0.26 1.01 0.22 1.00 C 0.18 0.99 0.16 0.95 0.17 0.91 L 0.21 0.69 L 0.05 0.53 C 0.02 0.50 0.00 0.46 0.01 0.42 C 0.02 0.38 0.05 0.35 0.09 0.34 L 0.31 0.31 L 0.41 0.11 C 0.43 0.07 0.46 0.05 0.50 0.05 Z" />
      </clipPath>
    </defs>
  </svg>

  <!-- Floating Balloons, Hearts & Birthday Vibe Over Photos & Screen -->
  <div class="bg-hearts">
    <span>🎈</span>
    <span>💖</span>
    <span>🎂</span>
    <span>🎈</span>
    <span>💕</span>
    <span>🎉</span>
    <span>🎈</span>
    <span>💗</span>
    <span>✨</span>
    <span>🎈</span>
  </div>

  <div class="surprise-card" id="mainCard">
    
    <!-- Left Section: Overlapping Rounded-Star Sticker Photos -->
    <div class="left-section">
      <div class="top-badge">🎂 Happy Birthday Celebration 🎉</div>
      
      <div class="star-collage">
        <!-- Photo 1 (Top Overlapping Star) -->
        <div class="star-sticker top-star">
          <img src="img1.jpeg" alt="Memory 1">
          <svg class="star-border-svg" viewBox="0 0 100 100">
            <path class="outer-pink" d="M 50 5 C 54 5 57 7 59 11 L 69 31 L 91 34 C 95 35 98 38 99 42 C 100 46 98 50 95 53 L 79 69 L 83 91 C 84 95 82 99 78 100 C 74 101 70 100 67 98 L 50 87 L 33 98 C 30 100 26 101 22 100 C 18 99 16 95 17 91 L 21 69 L 5 53 C 2 50 0 46 1 42 C 2 38 5 35 9 34 L 31 31 L 41 11 C 43 7 46 5 50 5 Z" />
            <path class="inner-white" d="M 50 5 C 54 5 57 7 59 11 L 69 31 L 91 34 C 95 35 98 38 99 42 C 100 46 98 50 95 53 L 79 69 L 83 91 C 84 95 82 99 78 100 C 74 101 70 100 67 98 L 50 87 L 33 98 C 30 100 26 101 22 100 C 18 99 16 95 17 91 L 21 69 L 5 53 C 2 50 0 46 1 42 C 2 38 5 35 9 34 L 31 31 L 41 11 C 43 7 46 5 50 5 Z" />
          </svg>
        </div>

        <!-- Photo 2 (Bottom Cascading Star) -->
        <div class="star-sticker bottom-star">
          <img src="img2.jpeg" alt="Memory 2">
          <svg class="star-border-svg" viewBox="0 0 100 100">
            <path class="outer-pink" d="M 50 5 C 54 5 57 7 59 11 L 69 31 L 91 34 C 95 35 98 38 99 42 C 100 46 98 50 95 53 L 79 69 L 83 91 C 84 95 82 99 78 100 C 74 101 70 100 67 98 L 50 87 L 33 98 C 30 100 26 101 22 100 C 18 99 16 95 17 91 L 21 69 L 5 53 C 2 50 0 46 1 42 C 2 38 5 35 9 34 L 31 31 L 41 11 C 43 7 46 5 50 5 Z" />
            <path class="inner-white" d="M 50 5 C 54 5 57 7 59 11 L 69 31 L 91 34 C 95 35 98 38 99 42 C 100 46 98 50 95 53 L 79 69 L 83 91 C 84 95 82 99 78 100 C 74 101 70 100 67 98 L 50 87 L 33 98 C 30 100 26 101 22 100 C 18 99 16 95 17 91 L 21 69 L 5 53 C 2 50 0 46 1 42 C 2 38 5 35 9 34 L 31 31 L 41 11 C 43 7 46 5 50 5 Z" />
          </svg>
        </div>
      </div>

      <div class="romantic-quote">
        <h2>Happy Birthday Ela 🎈</h2>
        <p>"Wishing the sweetest birthday to my favorite person ✨"</p>
      </div>

      <div class="city-silhouette"></div>
    </div>

    <!-- Right Section: Romantic Heart-Shaped Number Pad -->
    <div class="right-section">
      <h1>Birthday Surprise</h1>
      <p class="sub-prompt">Enter our special 4-digit code, my love 🎁</p>

      <div class="pass-dots" id="passDots">
        <div class="dot" id="dot-0">♥</div>
        <div class="dot" id="dot-1">♥</div>
        <div class="dot" id="dot-2">♥</div>
        <div class="dot" id="dot-3">♥</div>
      </div>

      <!-- Keypad Container that switches to Full-Pad Peach Cat Overlay -->
      <div class="keypad-container">
        
        <div class="keypad-grid" id="keypadGrid">
          <button class="key-btn" data-key="1" onclick="pressKey('1', this)">
            <span class="key-num">1</span>
            <span class="key-sub">First ✨</span>
          </button>
          <button class="key-btn" data-key="2" onclick="pressKey('2', this)">
            <span class="key-num">2</span>
            <span class="key-sub">Us 💑</span>
          </button>
          <button class="key-btn" data-key="3" onclick="pressKey('3', this)">
            <span class="key-num">3</span>
            <span class="key-sub">Always ♾️</span>
          </button>
          <button class="key-btn" data-key="4" onclick="pressKey('4', this)">
            <span class="key-num">4</span>
            <span class="key-sub">Love 💖</span>
          </button>
          <button class="key-btn" data-key="5" onclick="pressKey('5', this)">
            <span class="key-num">5</span>
            <span class="key-sub">Soul 💫</span>
          </button>
          <button class="key-btn" data-key="6" onclick="pressKey('6', this)">
            <span class="key-num">6</span>
            <span class="key-sub">Dream 🌙</span>
          </button>
          <button class="key-btn" data-key="7" onclick="pressKey('7', this)">
            <span class="key-num">7</span>
            <span class="key-sub">Lucky 🍀</span>
          </button>
          <button class="key-btn" data-key="8" onclick="pressKey('8', this)">
            <span class="key-num">8</span>
            <span class="key-sub">Hugs 🤗</span>
          </button>
          <button class="key-btn" data-key="9" onclick="pressKey('9', this)">
            <span class="key-num">9</span>
            <span class="key-sub">Smile 😊</span>
          </button>
          <button class="key-btn action-heart" data-key="heart" onclick="pressKey('heart', this)">
            <span class="key-num">💖</span>
            <span class="key-sub">Love</span>
          </button>
          <button class="key-btn" data-key="0" onclick="pressKey('0', this)">
            <span class="key-num">0</span>
            <span class="key-sub">All 💕</span>
          </button>
          <button class="key-btn action-back" data-key="back" onclick="pressKey('back', this)">
            <span class="key-num">⌫</span>
            <span class="key-sub">Clear</span>
          </button>
        </div>

        <!-- Full-Pad Peach Cat Overlay -->
        <div class="cute-cat-overlay" id="cuteCatOverlay">
          <div class="cat-gif-large">
            <div class="tenor-gif-embed" data-postid="22725233" data-share-method="host" data-aspect-ratio="1" data-width="100%">
              <a href="https://tenor.com/view/peach-cat-kiss-sad-and-gif-22725233">Peach Cat Sticker</a>
            </div>
          </div>
          <div class="cat-msg">No no, wrong code! 🥺</div>
        </div>

      </div>

      <div id="errorMsg" class="error-msg">Wrong code! Try again my love 💕</div>
      <div class="hint-box" onclick="alert('Hint: Our secret birthday code is 1234 🎂')">💡 Need a hint?</div>
    </div>

  </div>

  <!-- Tenor Embed Script -->
  <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

  <script>
    let enteredPass = "";
    const correctPass = "1234";

    function triggerHeartArrowSequence(btnEl) {
      if (!btnEl) return;
      const rect = btnEl.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top + rect.height / 2;

      // 1. Create heart rising from button
      const heart = document.createElement("span");
      heart.className = "soaring-heart";
      heart.textContent = "💖";
      heart.style.left = startX + "px";
      heart.style.top = startY + "px";
      document.body.appendChild(heart);

      // Mid-air collision coordinates (middle of the screen)
      const midX = startX + (Math.random() * 50 - 25);
      const midY = startY - 170;

      // Move heart up to mid-air
      requestAnimationFrame(() => {
        heart.style.left = midX + "px";
        heart.style.top = midY + "px";
        heart.style.transform = "translate(-50%, -50%) scale(1.3)";
      });

      // 2. Launch Arrow ONLY from side when heart reaches mid-air
      setTimeout(() => {
        const fromLeft = Math.random() > 0.5;
        const arrow = document.createElement("span");
        arrow.className = "flying-arrow";
        arrow.textContent = "➵";

        const arrowStartX = fromLeft ? midX - 220 : midX + 220;
        const arrowStartY = midY + 30;

        arrow.style.left = arrowStartX + "px";
        arrow.style.top = arrowStartY + "px";
        
        if (fromLeft) {
          arrow.style.transform = "translate(-50%, -50%) rotate(25deg)";
        } else {
          arrow.style.transform = "translate(-50%, -50%) scaleX(-1) rotate(25deg)";
        }

        document.body.appendChild(arrow);

        requestAnimationFrame(() => {
          arrow.style.left = midX + "px";
          arrow.style.top = midY + "px";
        });

        // 3. Impact & Shatter
        setTimeout(() => {
          heart.remove();
          arrow.style.opacity = "0";
          setTimeout(() => arrow.remove(), 200);

          const pieces = ["💔", "💔", "💖", "✨", "💕", "💘"];
          pieces.forEach((pIcon, i) => {
            const piece = document.createElement("span");
            piece.className = "shatter-piece";
            piece.textContent = pIcon;
            piece.style.left = midX + "px";
            piece.style.top = midY + "px";
            piece.style.fontSize = i < 2 ? "28px" : "20px";

            const angle = (Math.PI * 2 * i) / pieces.length + (Math.random() * 0.5);
            const radius = 55 + Math.random() * 45;
            piece.style.setProperty("--dx", (Math.cos(angle) * radius).toFixed(1) + "px");
            piece.style.setProperty("--dy", (Math.sin(angle) * radius).toFixed(1) + "px");
            piece.style.setProperty("--drot", (Math.random() * 160 - 80).toFixed(0) + "deg");

            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 750);
          });
        }, 280);

      }, 320);
    }

    function triggerButtonGlow(btnEl) {
      if (!btnEl) return;
      btnEl.classList.remove("glow-anim");
      void btnEl.offsetWidth; // Force reflow
      btnEl.classList.add("glow-anim");
      triggerHeartArrowSequence(btnEl);
    }

    function pressKey(val, btnEl) {
      const targetBtn = btnEl || document.querySelector(`.key-btn[data-key="${val}"]`);
      triggerButtonGlow(targetBtn);

      const errorMsg = document.getElementById('errorMsg');
      const passDots = document.getElementById('passDots');
      const keypadGrid = document.getElementById('keypadGrid');
      const cuteCatOverlay = document.getElementById('cuteCatOverlay');
      
      errorMsg.classList.remove('show');

      if (val === 'back') {
        enteredPass = enteredPass.slice(0, -1);
      } else if (val === 'heart') {
        passDots.style.transform = 'scale(1.06)';
        setTimeout(() => passDots.style.transform = 'scale(1)', 200);
      } else {
        if (enteredPass.length < 4) {
          enteredPass += val;
        }
      }

      updateDots();

      if (enteredPass.length === 4) {
        if (enteredPass === correctPass) {
          setTimeout(() => {
            window.location.href = 'heart.html';
          }, 900);
        } else {
          setTimeout(() => {
            errorMsg.classList.add('show');
            passDots.classList.add('shake');
            setTimeout(() => passDots.classList.remove('shake'), 400);

            // Hide keypad grid and show Full-Pad Peach Cat Overlay
            keypadGrid.classList.add('hidden');
            cuteCatOverlay.classList.add('show');

            // After 3.5 seconds, hide cat overlay and restore keypad grid for retry
            setTimeout(() => {
              cuteCatOverlay.classList.remove('show');
              keypadGrid.classList.remove('hidden');
              errorMsg.classList.remove('show');
            }, 3500);

            enteredPass = "";
            updateDots();
          }, 250);
        }
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < enteredPass.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        pressKey('back');
      }
    });
  </script>
</body>
</html>
