<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Surprise - Ela</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-1: #ffdde1;
      --bg-pink-2: #ee9ca7;
      --accent-pink: #ff2a6d;
      --accent-soft: #ff758f;
      --text-main: #4a152b;
      --text-sub: #8a4b66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-pink-1) 0%, var(--bg-pink-2) 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 15px;
    }

    /* Floating Background Hearts */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-hearts span {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      opacity: 0.4;
      animation: floatUp 8s linear infinite;
    }

    .bg-hearts span:nth-child(1) { left: 10%; animation-duration: 7s; font-size: 18px; }
    .bg-hearts span:nth-child(2) { left: 25%; animation-duration: 10s; animation-delay: 2s; font-size: 26px; }
    .bg-hearts span:nth-child(3) { left: 50%; animation-duration: 8s; animation-delay: 1s; font-size: 20px; }
    .bg-hearts span:nth-child(4) { left: 75%; animation-duration: 11s; animation-delay: 3s; font-size: 24px; }
    .bg-hearts span:nth-child(5) { left: 90%; animation-duration: 6s; animation-delay: 4s; font-size: 16px; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Main Split Container */
    .surprise-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 50px rgba(173, 20, 87, 0.18);
      display: flex;
      flex-direction: row;
      max-width: 940px;
      width: 100%;
      min-height: 560px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Left Section: Side-by-Side Romantic Photos */
    .left-section {
      flex: 1.1;
      background: linear-gradient(160deg, rgba(255, 240, 245, 0.85) 0%, rgba(255, 182, 193, 0.45) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 25px;
      border-right: 1.5px solid rgba(255, 255, 255, 0.7);
    }

    .top-badge {
      background: rgba(255, 255, 255, 0.85);
      color: var(--accent-pink);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.12);
      margin-bottom: 25px;
    }

    /* Romantic Heart Photo Frames */

.photos-wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin-bottom: 30px;
}

.heart-frame {
  width: 150px;
  height: 150px;
  position: relative;
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
  filter: drop-shadow(0 8px 10px rgba(255, 42, 109, 0.25));
  transition: transform 0.4s ease;
}

.heart-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  clip-path: url(#heartClip);
}

/* Heart Border */
.heart-border {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.heart-border path {
  fill: none;
  stroke: #fff;
  stroke-width: 3.5;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 3px #ff75a0);
}

/* Inner Pink Border */
.heart-border path {
  paint-order: stroke;
}

.heart-frame::after {
  content: " ";
  position: absolute;
  inset: 3px;
  pointer-events: none;
  clip-path: url(#heartClip);
  border-radius: 50%;
  box-shadow: inset 0 0 12px rgba(255, 42, 109, 0.25);
}

.polaroid-left {
  transform: rotate(-8deg) translateY(-5px);
  z-index: 1;
}

.polaroid-right {
  transform: rotate(8deg) translateY(8px);
  z-index: 2;
}

.heart-frame:hover {
  transform: rotate(0deg) scale(1.1) translateY(-5px);
  z-index: 10;
}

.polaroid-caption {
  position: absolute;
  bottom: -20px;
  left: 0;
  width: 100%;
  text-align: center;
  font-family: 'Great Vibes', cursive;
  font-size: 17px;
  color: #b52c5b;
}

    .center-heart {
      position: absolute;
      z-index: 5;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff2a6d, #ff758f);
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 6px 15px rgba(255, 42, 109, 0.4);
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.15); }
      50% { transform: scale(1); }
      75% { transform: scale(1.12); }
    }

    .romantic-quote {
      text-align: center;
      z-index: 3;
      max-width: 300px;
    }

    .romantic-quote h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 36px;
      color: var(--accent-pink);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .romantic-quote p {
      font-size: 12px;
      color: var(--text-sub);
      font-style: italic;
    }

    .city-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(to top, rgba(216, 27, 96, 0.25), transparent);
      clip-path: polygon(
        0% 100%, 0% 60%, 8% 60%, 8% 40%, 15% 40%, 15% 70%, 22% 70%, 22% 25%, 
        30% 25%, 30% 50%, 38% 50%, 38% 15%, 45% 15%, 45% 55%, 55% 55%, 
        55% 30%, 65% 30%, 65% 65%, 75% 65%, 75% 20%, 85% 20%, 85% 50%, 
        93% 50%, 93% 70%, 100% 70%, 100% 100%
      );
      pointer-events: none;
    }

    /* Right Section: Romantic Number Pad */
    .right-section {
      flex: 1;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .right-section h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .right-section .sub-prompt {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* Heart Passcode Dots */
    .pass-dots {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      background: rgba(255, 240, 245, 0.9);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1.5px solid #ffb3c6;
      box-shadow: inset 0 2px 6px rgba(255, 42, 109, 0.08);
    }

    .dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--accent-soft);
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      color: transparent;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dot.filled {
      background: linear-gradient(135deg, #ff2a6d, #ff758f);
      border-color: #ff2a6d;
      color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 4px 10px rgba(255, 42, 109, 0.35);
    }

    /* Romantic Keypad Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 260px;
      margin-bottom: 10px;
    }

    /* Romantic Heart-Inspired Keypad Buttons */
/* Aesthetic Romantic Heart Keypad */
.key-btn {
  height: 75px;
  width: 75px;
  justify-self: center;
  align-self: center;

  background: linear-gradient(
    145deg,
    #fffafd 0%,
    #ffdce8 55%,
    #ffb6cd 100%
  );

  border: none;
  border-radius: 0;
  clip-path: path("M 37.5 70 C 30 62, 3 44, 3 24 C 3 5, 27 0, 37.5 17 C 48 0, 72 5, 72 24 C 72 44, 45 62, 37.5 70 Z");

  font-family: 'Poppins', sans-serif;
  cursor: pointer;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  position: relative;
  transition: transform 0.3s ease, filter 0.3s ease;

  filter: drop-shadow(0 5px 5px rgba(255, 42, 109, 0.22));
}

.key-btn:hover {
  transform: scale(1.12) translateY(-3px);
  filter: drop-shadow(0 8px 9px rgba(255, 42, 109, 0.35));
}

.key-btn:active {
  transform: scale(0.92);
}

.key-num {
  font-size: 16px;
  font-weight: 600;
  color: #9e3158;
  line-height: 1.2;
}

.key-sub {
  font-size: 9px;
  color: #e7477c;
  font-weight: 500;
}

/* Special Heart Button */
.key-btn.action-heart {
  background: linear-gradient(145deg, #ffb3ca, #ff2a6d);
}

.key-btn.action-heart .key-num,
.key-btn.action-heart .key-sub {
  color: white;
}

/* Backspace Heart */
.key-btn.action-back {
  background: linear-gradient(145deg, #ff2a6d, #ff85a5);
  border: none;
}

.key-btn.action-back .key-num,
.key-btn.action-back .key-sub {
  color: white;
}

    .error-msg {
      color: #d90429;
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .error-msg.show {
      opacity: 1;
    }

    .hint-box {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 15px;
      transition: 0.2s;
    }

    .hint-box:hover {
      background: rgba(255, 255, 255, 0.6);
      color: var(--accent-pink);
    }

    /* Shake Animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      .surprise-card {
        flex-direction: column;
        max-width: 380px;
        min-height: auto;
      }
      .left-section {
        padding: 22px 15px 18px;
        border-right: none;
        border-bottom: 1.5px solid rgba(255, 255, 255, 0.7);
      }
      .top-badge {
        margin-bottom: 12px;
      }
      .photos-wrapper {
        margin-bottom: 15px;
      }
      .polaroid-card {
        width: 115px;
        padding: 6px 6px 20px 6px;
      }
      .polaroid-card img {
        height: 120px;
      }
      .center-heart {
        width: 34px;
        height: 34px;
        font-size: 14px;
      }
      .romantic-quote h2 {
        font-size: 28px;
      }
      .right-section {
        padding: 20px 15px;
      }
      .right-section h1 {
        font-size: 38px;
      }
      .key-btn {
        height: 48px;
      }
      .key-num {
        font-size: 15px;
      }
      .key-sub {
        font-size: 8.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Background Hearts -->
  <div class="bg-hearts">
    <span>💖</span>
    <span>🌸</span>
    <span>💕</span>
    <span>✨</span>
    <span>💗</span>
  </div>

  <div class="surprise-card" id="mainCard">
    
    <!-- Left Section: Side-by-Side Romantic Polaroid Photos -->
    <div class="left-section">
      <div class="top-badge">✨ Special Birthday Edition ✨</div>
      
      <div class="photos-wrapper">

  <div class="polaroid-card polaroid-left heart-frame">
    <img src="img1.jpeg" alt="Memory 1">
    <svg class="heart-border" viewBox="0 0 100 90">
      <path d="M50 87 C42 79 3 53 3 30 C3 7 32 -2 50 22 C68 -2 97 7 97 30 C97 53 58 79 50 87Z"/>
    </svg>
    <div class="polaroid-caption">You</div>
  </div>

  <div class="center-heart">💖</div>

  <div class="polaroid-card polaroid-right heart-frame">
    <img src="img2.jpeg" alt="Memory 2">
    <svg class="heart-border" viewBox="0 0 100 90">
      <path d="M50 87 C42 79 3 53 3 30 C3 7 32 -2 50 22 C68 -2 97 7 97 30 C97 53 58 79 50 87Z"/>
    </svg>
    <div class="polaroid-caption">&amp; Me</div>
  </div>

</div>

      <div class="romantic-quote">
        <h2>Happy Birthday Ela</h2>
        <p>"Every moment with you feels like magic"</p>
      </div>

      <div class="city-silhouette"></div>
    </div>

    <!-- Right Section: Romantic Number Pad with Custom Subtexts -->
    <div class="right-section">
      <h1>Secret Portal</h1>
      <p class="sub-prompt">Enter our special 4-digit code, my love</p>

      <div class="pass-dots" id="passDots">
        <div class="dot" id="dot-0">♥</div>
        <div class="dot" id="dot-1">♥</div>
        <div class="dot" id="dot-2">♥</div>
        <div class="dot" id="dot-3">♥</div>
      </div>

      <!-- Romantic Keypad Grid -->
      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('1')">
          <span class="key-num">1</span>
          <span class="key-sub">First ✨</span>
        </button>
        <button class="key-btn" onclick="pressKey('2')">
          <span class="key-num">2</span>
          <span class="key-sub">Us 👩‍❤️‍👨</span>
        </button>
        <button class="key-btn" onclick="pressKey('3')">
          <span class="key-num">3</span>
          <span class="key-sub">Forever ♾️</span>
        </button>
        <button class="key-btn" onclick="pressKey('4')">
          <span class="key-num">4</span>
          <span class="key-sub">Love 💖</span>
        </button>
        <button class="key-btn" onclick="pressKey('5')">
          <span class="key-num">5</span>
          <span class="key-sub">Soul 💫</span>
        </button>
        <button class="key-btn" onclick="pressKey('6')">
          <span class="key-num">6</span>
          <span class="key-sub">Dreams 🌙</span>
        </button>
        <button class="key-btn" onclick="pressKey('7')">
          <span class="key-num">7</span>
          <span class="key-sub">Lucky 🍀</span>
        </button>
        <button class="key-btn" onclick="pressKey('8')">
          <span class="key-num">8</span>
          <span class="key-sub">Hugs 🤗</span>
        </button>
        <button class="key-btn" onclick="pressKey('9')">
          <span class="key-num">9</span>
          <span class="key-sub">Smiles 😊</span>
        </button>
        <button class="key-btn action-heart" onclick="pressKey('heart')">
          <span class="key-num">💖</span>
          <span class="key-sub">Heart</span>
        </button>
        <button class="key-btn" onclick="pressKey('0')">
          <span class="key-num">0</span>
          <span class="key-sub">All 💕</span>
        </button>
        <button class="key-btn action-back" onclick="pressKey('back')">
          <span class="key-num">⌫</span>
          <span class="key-sub">Clear</span>
        </button>
      </div>

      <div id="errorMsg" class="error-msg">Wrong code! Try again my love 💕</div>
      <div class="hint-box" onclick="alert('Hint: Our secret code is 1234 💖')">💡 Need a hint?</div>
    </div>

  </div>

  <script>
    let enteredPass = "";
    const correctPass = "1234";

    function pressKey(val) {
      const errorMsg = document.getElementById('errorMsg');
      const passDots = document.getElementById('passDots');
      errorMsg.classList.remove('show');

      if (val === 'back') {
        enteredPass = enteredPass.slice(0, -1);
      } else if (val === 'heart') {
        passDots.style.transform = 'scale(1.06)';
        setTimeout(() => passDots.style.transform = 'scale(1)', 200);
      } else {
        if (enteredPass.length < 4) {
          enteredPass += val;
        }
      }

      updateDots();

      if (enteredPass.length === 4) {
        if (enteredPass === correctPass) {
          setTimeout(() => {
            window.location.href = 'heart.html';
          }, 350);
        } else {
          setTimeout(() => {
            errorMsg.classList.add('show');
            passDots.classList.add('shake');
            setTimeout(() => passDots.classList.remove('shake'), 400);
            enteredPass = "";
            updateDots();
          }, 250);
        }
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < enteredPass.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        pressKey('back');
      }
    });
  </script>
</body>
</html>
