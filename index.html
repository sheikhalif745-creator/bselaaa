<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Surprise - Ela</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-light: #fce4ec;
      --bg-pink-medium: #f8bbd0;
      --accent-pink: #e91e63;
      --accent-dark: #c2185b;
      --text-main: #4a2c3d;
      --text-sub: #885873;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-pink-light);
      background-image: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Decorative Floral Elements in Corners */
    .flower-top-left {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      opacity: 0.8;
    }

    .flower-bottom-right {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 32px;
      opacity: 0.8;
    }

    /* Main Split Container */
    .surprise-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      border: 2px solid #ffffff;
      box-shadow: 0 20px 40px rgba(233, 30, 99, 0.15);
      display: flex;
      flex-direction: row;
      max-width: 900px;
      width: 90%;
      height: 520px;
      overflow: hidden;
      position: relative;
    }

    /* Left Aesthetic Photo & Silhouette Section */
    .left-section {
      flex: 1;
      background: linear-gradient(180deg, rgba(252, 228, 236, 0.6) 0%, rgba(244, 143, 177, 0.4) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 30px;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Floating Heart Balloon simulation */
    .heart-balloon {
      position: absolute;
      top: 30px;
      left: 30px;
      font-size: 35px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Aesthetic Overlapping Circular Photos */
    .photo-cluster {
      position: absolute;
      top: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .aesthetic-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: absolute;
      transition: 0.3s;
    }

    .aesthetic-img:hover {
      transform: scale(1.05);
      z-index: 10;
    }

    .img-1 {
      left: 70px;
      transform: rotate(-8deg);
      z-index: 1;
    }

    .img-2 {
      right: 70px;
      top: 30px;
      transform: rotate(8deg);
      z-index: 2;
    }

    /* City Skyline Silhouette Graphics at Bottom */
    .city-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: linear-gradient(to top, #ad1457, #d81b60);
      opacity: 0.85;
      clip-path: polygon(
        0% 100%, 0% 60%, 5% 60%, 5% 45%, 8% 45%, 8% 70%, 12% 70%, 12% 30%, 
        16% 30%, 16% 50%, 22% 50%, 22% 20%, 27% 20%, 27% 40%, 33% 40%, 
        33% 15%, 38% 15%, 38% 55%, 45% 55%, 45% 35%, 52% 35%, 52% 65%, 
        60% 65%, 60% 40%, 68% 40%, 68% 25%, 75% 25%, 75% 50%, 83% 50%, 
        83% 20%, 90% 20%, 90% 45%, 95% 45%, 95% 70%, 100% 70%, 100% 100%
      );
      z-index: 3;
    }

    .couple-text {
      position: relative;
      z-index: 4;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    /* Right Login / Password Section */
    .right-section {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .right-section h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: var(--accent-dark);
      margin-bottom: 5px;
    }

    .right-section p {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 30px;
    }

    .input-group {
      width: 100%;
      max-width: 300px;
      margin-bottom: 15px;
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border-radius: 25px;
      border: 1px solid #f48fb1;
      background: #fff5f8;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    .input-field:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 10px rgba(233, 30, 99, 0.2);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 13px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      max-width: 300px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-dark));
      border: none;
      color: white;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
      transition: 0.3s;
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    }

    .error-msg {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    .hint-box {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 20px;
      cursor: pointer;
    }

    /* Responsive Design for Mobiles */
    @media (max-width: 768px) {
      .surprise-card {
        flex-direction: column;
        height: auto;
        max-width: 380px;
      }
      .left-section {
        height: 220px;
        padding: 20px;
      }
      .aesthetic-img {
        width: 90px;
        height: 90px;
      }
      .img-1 { left: 40px; top: 30px; }
      .img-2 { right: 40px; top: 30px; }
      .right-section {
        padding: 30px 20px;
      }
      .right-section h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>

  <div class="flower-top-left">🌸</div>
  <div class="flower-bottom-right">🌺</div>

  <div class="surprise-card">
    
    <!-- Left Side: Aesthetic Photos & Skyline Theme -->
    <div class="left-section">
      <div class="heart-balloon">🎈</div>
      
      <!-- Overlapping Aesthetic Circular Photos -->
      <div class="photo-cluster">
        <img src="img1.jpeg" alt="Ela 1" class="aesthetic-img img-1">
        <img src="img2.jpeg" alt="Ela 2" class="aesthetic-img img-2">
      </div>

      <!-- City Skyline & Silhouette Bottom Graphic -->
      <div class="city-silhouette"></div>
      <div class="couple-text">Happy Birthday Ela ✨</div>
    </div>

    <!-- Right Side: Welcome & Secret Code Login -->
    <div class="right-section">
      <h1>Welcome</h1>
      <p>Please enter your birthday secret code below</p>

      <div class="input-group">
        <span class="input-icon">🔐</span>
        <input type="password" id="passInput" class="input-field" placeholder="Enter secret password..." autocomplete="off">
      </div>

      <button class="login-btn" onclick="checkPass()">OPEN SURPRISE 💖</button>
      
      <p id="errorMsg" class="error-msg">Incorrect password, try again!</p>
      
      <div class="hint-box" onclick="alert('Hint: Default code is 1234')">Need a hint? 💡</div>
    </div>

  </div>

  <script>
    function checkPass() {
      const input = document.getElementById('passInput').value;
      const errorMsg = document.getElementById('errorMsg');
      
      // পাসওয়ার্ড এখানে পরিবর্তন করতে পারবেন (যেমন: '1234' বা আপনার পছন্দমতো)
      if (input === '1234') {
        errorMsg.style.display = 'none';
        window.location.href = 'heart.html'; // পাসওয়ার্ড সঠিক হলে অ্যানিমেশন পেজে নিয়ে যাবে
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Enter Key Support
    document.getElementById('passInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPass();
      }
    });
  </script>
</body>
</html>
